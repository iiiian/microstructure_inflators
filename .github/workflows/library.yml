name: Library

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang libboost-dev libgmp-dev libmpfr-dev
      - name: Configure
        run: cmake --preset library -DCMAKE_INSTALL_PREFIX="$PWD/build/install" -DCMAKE_INSTALL_LIBDIR=lib
      - name: Build
        run: cmake --build build/library --target inflator_api_test
      - name: Test 2D and 3D
        run: ctest --test-dir build/library --output-on-failure
      - name: Install and test standalone consumer
        run: |
          cmake --install build/library
          cmake -S tests/consumer -B build/consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/install"
          cmake --build build/consumer
          ctest --test-dir build/consumer --output-on-failure
      - name: Check exported interface
        run: |
          test "$(find build/install/include -type f | wc -l)" -eq 1
          nm -D --defined-only build/install/lib/libinflator.so | c++filt | tee build/exports.txt
          test "$(wc -l < build/exports.txt)" -eq 1
          grep -F 'inflator::inflate(inflator::Request const&)' build/exports.txt

  windows:
    runs-on: windows-2022
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - name: Cache dependency binaries
        id: dependencies
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: windows-inflator-vcpkg-v2
      - name: Install dependencies
        shell: pwsh
        run: >-
          vcpkg install --triplet x64-windows
          boost-bimap boost-callable-traits boost-foreach boost-format boost-graph
          boost-heap boost-multiprecision boost-parameter boost-ptr-container
          boost-random boost-typeof boost-unordered gmp mpfr
      - name: Save dependency binaries
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: windows-inflator-vcpkg-v2
      - name: Configure and build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          set "CL=/DDEBUG_MARCHING_SQUARES=1"
          cmake --preset library -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_INSTALL_PREFIX="%CD%/build/install"
          if errorlevel 1 exit /b 1
          cmake --build build/library --target inflator_api_test
      - name: Test 2D and 3D
        run: ctest --test-dir build/library --output-on-failure
      - name: Install and test standalone consumer
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          cmake --install build/library
          if errorlevel 1 exit /b 1
          cmake -S tests/consumer -B build/consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%CD%/build/install"
          if errorlevel 1 exit /b 1
          cmake --build build/consumer
          if errorlevel 1 exit /b 1
          set "PATH=%CD%\build\install\bin;%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\bin;%PATH%"
          ctest --test-dir build/consumer --output-on-failure
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-meshing-diagnostics
          path: |
            build/library/*.msh
            build/library/Testing/Temporary/LastTest.log
